<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小朋友滑滑梯練運筆:捺</title>
    <style>
        /* 防誤觸與全局設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #game-container { 
            position: relative; width: 100%; max-width: 900px; aspect-ratio: 4 / 3; 
            background-color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            border-radius: 20px; overflow: hidden; touch-action: none;
        }

        .layer-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        /* 滑梯縮放設定：縮小至 0.7 並放置於草地上 */
        #slide { 
            width: 70%; 
            left: 15%;  
            top: 15%;   
            transform: scale(0.7); 
            transform-origin: top center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #stars-container { position: absolute; top: 15px; left: 20px; font-size: 40px; color: #ccc; z-index: 10; text-shadow: 2px 2px 0 #fff; }
        .star-active { color: #FFD700; }

        #target-glow { 
            position: absolute; width: 70px; height: 70px; border-radius: 50%; 
            background: rgba(255, 215, 0, 0.4); border: 4px solid #FFD700; 
            transform: translate(-50%, -50%); animation: pulse 1s infinite alternate; z-index: 5; 
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        
        /* 小朋友角色放大 3 倍 (假設原基本大小約 50-60px，此處設為 160px) 於起點準備 */
        #player { 
            position: absolute; width: 160px; height: 160px; transform: translate(-50%, -50%); 
            cursor: grab; z-index: 20; touch-action: none; object-fit: contain;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
        }

        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        #overlay.show { opacity: 1; pointer-events: auto; }
        #message { font-size: 60px; color: #FF5722; font-weight: bold; text-shadow: 3px 3px 0px #FFC107; }
        #btn-replay { margin-top: 40px; padding: 15px 40px; font-size: 30px; font-weight: bold; background-color: #4CAF50; color: white; border: none; border-radius: 50px; cursor: pointer; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div id="game-container">
    <img id="bg" class="layer-img" src="11.png" alt="背景">
    <img id="slide" class="layer-img" src="13new.png" alt="滑梯">
    <canvas id="guide-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
    <div id="stars-container">★ ★ ★ ★ ★</div>
    <div id="target-glow"></div>
    <img id="player" src="boy.png" alt="小朋友" draggable="false">
    <div id="overlay">
        <div id="message">✨ 你真努力！</div>
        <button id="btn-replay">再玩一次</button>
    </div>
</div>

<script>
    // 配合 0.7 倍滑梯弧度的「捺」形軌跡設定
    const config = {
        levels: ['boy.png', 'girl.png', 'boy.png', 'girl.png', 'boy.png'],
        startX: 0.35, startY: 0.22, // 滑梯頂端起點
        ctrlX:  0.48, ctrlY:  0.46, // 完美貼合滑梯彎曲弧度的控制點
        endX:   0.65, endY:   0.68, // 滑梯底部終點
        hitRadius: 65
    };

    let currentLevel = 0, isDragging = false, starsEarned = 0;
    const container = document.getElementById('game-container');
    const guideCanvas = document.getElementById('guide-canvas'), drawCanvas = document.getElementById('draw-canvas');
    const guideCtx = guideCanvas.getContext('2d'), drawCtx = drawCanvas.getContext('2d');
    const player = document.getElementById('player'), targetGlow = document.getElementById('target-glow');
    const overlay = document.getElementById('overlay'), replayBtn = document.getElementById('btn-replay'), starsContainer = document.getElementById('stars-container');

    let startPx = {x: 0, y: 0}, ctrlPx = {x: 0, y: 0}, endPx = {x: 0, y: 0};
    
    function resizeAndInit() {
        const rect = container.getBoundingClientRect();
        guideCanvas.width = rect.width; guideCanvas.height = rect.height;
        drawCanvas.width = rect.width; drawCanvas.height = rect.height;
        
        startPx = {x: rect.width * config.startX, y: rect.height * config.startY};
        ctrlPx  = {x: rect.width * config.ctrlX,  y: rect.height * config.ctrlY};
        endPx   = {x: rect.width * config.endX,   y: rect.height * config.endY};

        targetGlow.style.left = `${endPx.x}px`;
        targetGlow.style.top = `${endPx.y}px`;

        drawGuidePath();
        resetPlayer();
    }

    // 繪製配合滑梯弧度的半透明安全引導線
    function drawGuidePath() {
        guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
        guideCtx.beginPath();
        guideCtx.moveTo(startPx.x, startPx.y);
        guideCtx.quadraticCurveTo(ctrlPx.x, ctrlPx.y, endPx.x, endPx.y);
        guideCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        guideCtx.lineWidth = 55; 
        guideCtx.lineCap = 'round';
        guideCtx.stroke();
    }

    function loadLevel() {
        player.src = config.levels[currentLevel];
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        resetPlayer();
        overlay.classList.remove('show');
    }

    // 將小朋友置於起點準備
    function resetPlayer() {
        player.style.left = `${startPx.x}px`;
        player.style.top = `${startPx.y}px`;
    }

    function updateStars() {
        starsContainer.innerHTML = Array(5).fill(0).map((_, i) => i < starsEarned ? '<span class="star-active">★</span> ' : '<span>★</span> ').join('');
    }

    player.addEventListener('pointerdown', (e) => {
        isDragging = true;
        player.setPointerCapture(e.pointerId);
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        drawCtx.beginPath();
        drawCtx.moveTo(startPx.x, startPx.y);
    });

    player.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        let curX = e.clientX - rect.left, curY = e.clientY - rect.top;
        
        player.style.left = `${curX}px`; 
        player.style.top = `${curY}px`;

        // 即時畫出運筆實線
        drawCtx.lineTo(curX, curY);
        drawCtx.strokeStyle = '#FF5722'; 
        drawCtx.lineWidth = 18; 
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.stroke();
        drawCtx.beginPath(); 
        drawCtx.moveTo(curX, curY);

        if (Math.hypot(endPx.x - curX, endPx.y - curY) < config.hitRadius) {
            winLevel();
        }
    });

    player.addEventListener('pointerup', () => {
        if (!isDragging) return;
        isDragging = false;
        
        const currentDist = Math.hypot(endPx.x - parseFloat(player.style.left), endPx.y - parseFloat(player.style.top));
        if (currentDist >= config.hitRadius) {
            resetPlayer();
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }
    });

    function winLevel() {
        isDragging = false;
        if(starsEarned < currentLevel + 1) starsEarned++;
        updateStars();
        overlay.classList.add('show');
        
        if (currentLevel < 4) {
            setTimeout(() => { currentLevel++; loadLevel(); }, 2000);
        } else {
            setTimeout(() => { replayBtn.style.display = 'block'; }, 1000);
        }
    }

    replayBtn.addEventListener('click', () => { location.reload(); });
    window.addEventListener('resize', resizeAndInit);
    window.onload = () => { resizeAndInit(); updateStars(); loadLevel(); };
</script>
</body>
</html>
